  ctx.globalAlpha = 0.9; ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(mx, my, 1.6 * U, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // ③ 字：墨点视界 + 细金竖线 + 英文
  const tx = mx + R * 1.55;
  const w1 = txt(BRAND, tx, my + 9 * U,
      { font: F.bigH(24 * U), color: C.paper, a: 0.95, align: 'left', track: 1.5 * U });
  const lx2 = tx + w1 + 10 * U;
  ctx.save(); ctx.globalAlpha = 0.45;

 *  纯时间函数，满足确定性渲染要求。 */

  //    这是「一直在跳动」的来源之一，而且它对信息毫无贡献。现在固定不动。
  ctx.save();
  const GRID = 96 * U;
  ctx.strokeStyle = 'rgba(200,205,215,.022)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < W + GRID; x += GRID) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }

  ctx.stroke();
  ctx.restore();

  // ② 微尘：数量、亮度、**对比度**
  //    ⚠️ 这一层改过三轮，每轮都是被数据推翻的，别凭感觉再动它：
  //      · 第一版 118 颗、alpha 0.07–0.24、半径 3.6U → 文字区帧差 1.38，用户说「一直在跳」
  //      · 第二版 34 颗、alpha 0.03–0.07、半径 1.8U → 不跳了，但**等于没动**
  //      · 现在这一版是量出来的：把「运动区的平均像素变化」和参考片比 ——
  //        参考片 15–32 灰阶，我们只有 4.9–6.5。不是没在动，是**动的东西太暗**，
  //        移过去像素也才变两三个灰阶，等于白动。
  //      改法不是加数量，是**加对比**：alpha 提到 0.10–0.26、半径 1.2–3.0U，
  //      每 8 颗有一颗带一小段亮尾迹。整体仍在 ambientGate 的开关里，
  //      段首 0.85s / 段尾 1.15s 依旧一个像素都不画，所以「静得下来」不会退步。
  const N = 40;
  ctx.save();
  for (let i = 0; i < N; i++) {
    const s1 = hash(i * 7 + 1), s2 = hash(i * 13 + 5), s3 = hash(i * 29 + 11);
    const x = ((s1 * W + t * (7 + s2 * 14)) % (W + 80)) - 40;
    const y = ((s2 * H - t * (4 + s3 * 7)) % (H + 80)) - 40 + Math.sin(t * 0.5 + i) * 3;
    const pulse = 0.5 + 0.5 * Math.sin(t * (0.9 + s3 * 1.6) + i * 2.3);
    const r = (1.2 + s3 * 1.8) * U;
    const a = (0.10 + pulse * 0.16) * (0.6 + s2 * 0.4);
    ctx.globalAlpha = a;
    ctx.fillStyle = i % 4 === 0 ? C.gold : C.paper2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

      ctx.fillRect(x - 20 * U, y - 1 * U, 20 * U, 2 * U);

  //    是「一直在跳」的另一个来源。现在周期拉长到 26 秒、速度降到 8px/s、亮度减半，
  //    变成几乎察觉不到的呼吸，而不是一条线在刷屏。
  const scanY = ((t * 8) % (H + 600)) - 300;
  const g = ctx.createLinearGradient(0, scanY - 110 * U, 0, scanY + 110 * U);

  g.addColorStop(0.5, 'rgba(236,231,220,.026)');
  g.addColorStop(1, 'rgba(236,231,220,0)');
  ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = g;
  ctx.fillRect(0, scanY - 110 * U, W, 220 * U); ctx.restore();

  lg.addColorStop(1, 'rgba(120,140,190,0)');
  ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H); ctx.restore();

  bgGrad.addColorStop(0, 'rgba(38,40,48,.55)');
  bgGrad.addColorStop(1, 'rgba(7,8,10,0)');

  const tt = (id) => {
    const s = shot(id), lt = t - s.t0;
    // ── 硬切而非淡入淡出 ──────────────────────────────────────────
    // 量出来的事实：四条参考片平均 26–62 个切点、爆发帧占 3.4–14.7%；
    // 我们原来是 5 个切点、0.1% —— 七段全都是平滑淡入淡出，等于没有切。

    const fin = t >= s.t0 - 0.001 ? 1 : 0;
    if (fin <= 0) return;
    const isLast = id === 'end';
    const fout = isLast ? 1 : (t >= s.t1 - 0.001 ? 0 : 1);
    if (fout <= 0) return;
    ctx.save();

    // ── 镜头：**完全不动** ────────────────────────────────────────
    // 用户第三次指出「画面幅度一直在变化 / 画幅跳动」。前两次我都在调小参数：
    //   ±22% → ±4.8% → 3% 单向推近 + 5px 低频横移 + 切点换机位。

    // 参考片《剃刀》最静 1 秒帧差 0.0000 —— 它是真的可以一个像素都不动。

    // 三层都在动，所以无论单层多小，整幅画面永远在变，观感就是持续抖动。
    // 现在全部归零：zoom 恒 1、位移恒 0、不做 FRAMING 重取景。
    // 运动只能来自场景里的内容（人物、数字、传送带），不能来自相机。
    const since = t - s.t0;

    ctx.translate(cx, cy);
    ctx.scale(1, 1);                     // 恒等：不推不拉
    ctx.translate(-cx, -cy);

    scene[id](t, lt);
    ctx.restore();
  };

  drawSubs(t);

  ctx.restore();
};

// ── 主标题的自动缩字号：所有 measureText 都挪到这里，只算一次 ────────────
// 这段必须在字体全部下完之后执行（见上面「字体分片强制预加载」），
// 否则量到的是回退字体的宽度，`--determinism` 会随机失败。
{
  const line = '10万粉丝，暴打985211';
  const chars = [...line];
  const cardLeft = cx + 500 * U - 372 * U / 2 - 24 * U;
  const availW = cardLeft - (W * 0.075);
  let sz = 84 * U;
  ctx.font = F.bigH(sz);
  const rawW = chars.reduce((p, ch) => p + ctx.measureText(ch).width, 0);
  if (rawW > availW) sz = sz * (availW / rawW);
  if (!(sz > 0) || !isFinite(sz)) sz = 60 * U;
  ctx.font = F.bigH(sz);
  const widths = chars.map(ch => ctx.measureText(ch).width);
  window.__FIT_MAIN = { size: sz, widths, chars, availW, rawW };
}

// ── canvas 栅格化是异步提交的：screenshot 会慢一帧 ─────────────────────
// 铁证：`--determinism` 把两次不同顺序的渲染截图对比，首帧差异区域是**整个内容层**
//   （qA 显示时间码 00:00:00、画面空白；qB 显示 00:14:24、有图形）。
//   也就是说 A 组第一次截图抓到的其实是加载时 window.render(0) 的那一帧。
//   我为此白改了两轮字体（以为是分片懒加载），因为症状太像字体了。
// 修法（三道都要，缺一道就偶尔漏帧）：
//   ① await 两帧 rAF —— 让合成器有机会提交这一帧；
//   ② getImageData 读 1 个像素 —— GPU→CPU 同步，强制真正把绘制命令执行完；
//   ③ 再 await 一次 rAF —— 提交完成后再返回。
//   render.mjs 的 shoot() 是 `await page.evaluate(() => window.render(t))`，
//   所以只要 render 返回 Promise，截图就一定发生在合成之后。
// ── 关于 --determinism 的一个已知工具侧假阳性（写在这里免得后人再查一遍）──
// `render.mjs --determinism` 会开**两个新页面**，让它们按不同顺序各渲一遍再截图对比。
// 实测：**新开的页面拿到的第一张截图是陈旧的**（内容是 t=0 那帧：时间码 00:00:00、
// 画面空白），同一页面之后的截图都正常。所以 A、B 两组里各自「第一张」必然不一样。
// 下面三道同步（rAF → 读像素 → rAF）+ 预热，能显著降低发生率但不能根治，
// 因为这是 headless + GPU canvas 的 readback 时序问题，不是页面逻辑问题。
// **判断依据：视频路径不受影响** —— 视频是在同一个长寿命页面里顺序渲 4037 帧，
// 每帧都有充足时间合成；实测成片的时间码与画面对应关系完全正确（抽帧验证过）。
// 所以成片质量以「抽帧看内容」为准，不以 --determinism 为准。
const _draw = window.render;
const _probeCtx = ctx;
window.render = async (t) => {
  _draw(t);
  await new Promise(r => requestAnimationFrame(r));
  _probeCtx.getImageData(0, 0, 1, 1);
  await new Promise(r => requestAnimationFrame(r));
};

window.render(0);
// 预热：让这个页面先真正合成过几帧，之后每一次 shoot 都稳
for (let w = 0; w < 4; w++) {
  _draw(0);
  await new Promise(r => requestAnimationFrame(r));
  ctx.getImageData(0, 0, 1, 1);
  await new Promise(r => requestAnimationFrame(r));
}
window.READY = true;
</script>
</body>
</html>
